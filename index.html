.chat-upsell{display:flex;align-items:center;gap:12px;width:calc(100% - 42px);margin:17px 21px 2px;padding:15px;background:#eef4e9;border:1px solid #e0e9d9;border-radius:13px;text-align:left}.chat-upsell .upsell-icon{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:#e0ebd8;color:#37713d;flex-shrink:0}.chat-upsell strong{display:block;font-size:14px;margin-bottom:5px}.chat-upsell small{display:block;font-size:11px;line-height:1.5;color:#71806a}.chat-upsell>svg{width:18px;color:#4b7142;margin-left:auto}.earn-upsell{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:20px;background:#e6f3e3;color:#177d3c;font-size:12px;font-weight:650;white-space:nowrap}.earn-upsell svg{width:16px;height:16px}.header-actions{display:flex;align-items:center;gap:10px}.profile-shortcut{padding:0;flex-shrink:0}.profile-shortcut .avatar{width:30px;height:30px;font-size:10px}</style></head><body>
<div class="shell"><aside class="intro"><div class="wordmark">Kalshi</div><h1>A new way<br>to get around.</h1><p>Trade, connect, track your portfolio, invest, and discover.</p><span class="pill">Navigation prototype · v1</span><small>Tap through all five tabs.<br>Sample markets, balances, and activity.<br>No real trades or messages.</small></aside><main class="phone"><div class="status"><span>9:41</span><div class="island"></div><div class="signals"><svg viewBox="0 0 24 24"><path d="M3 19v-3m5 3v-6m5 6V9m5 10V5"/></svg><svg viewBox="0 0 24 24"><path d="M3 9a14 14 0 0 1 18 0M6 13a9 9 0 0 1 12 0m-8 4a3 3 0 0 1 4 0"/></svg><svg viewBox="0 0 24 24"><rect x="2" y="6" width="18" height="12" rx="3"/><path d="M23 10v4M5 9h12v6H5z" fill="currentColor"/></svg></div></div><div id="screen" class="screen"></div><nav id="nav" class="nav" aria-label="Main navigation"></nav><div class="homebar"></div><div id="overlay"></div><div id="toast" aria-live="polite"></div></main></div>
<script>
const paths={gift:'M3 8h18v4H3z M5 12v9h14v-9 M12 8v13 M12 8H8a3 3 0 1 1 3-3l1 3 M12 8h4a3 3 0 1 0-3-3l-1 3',trade:'M4 18V10m5 8V5m5 13v-6m5 6V3',inbox:'M4 4h16v13h-5l-3 4-3-4H4z M4 12h5l2 3h2l2-3h5',portfolio:'M4 8h16v12H4z M8 8V4h8v4 M4 12h16',invest:'M3 17l6-6 4 3 8-10 M15 4h6v6',search:'M20 20l-5-5 M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0',heart:'M12 20 4 12C-3 5 6-1 12 6c6-7 15-1 8 6z',comment:'M20 11a8 8 0 0 1-8 8H5l-3 3V11a9 9 0 0 1 18 0',arrow:'M5 12h14m-5-5 5 5-5 5',back:'m14 5-7 7 7 7',spark:'m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3z',plus:'M12 4v16M4 12h16',bell:'M5 16h14l-2-3V8a5 5 0 0 0-10 0v5zM10 20h4',check:'m5 12 4 4 10-10',share:'M12 16V2m-5 5 5-5 5 5M5 12v9h14v-9'};
const icon=(n)=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.trade}"/></svg>`;
const state={tab:'trade',trade:'Trade',inbox:'Chats',portfolio:'Portfolio',profileTab:'Posts',category:'All',period:'1D',read:new Set(),follow:new Set(),likes:new Set(),chat:null,messages:{},query:'',ai:false,side:'Yes',market:null};
const markets=[{id:0,title:'How many Fed rate cuts this year?',sub:'Economics · $12.4m vol',tile:'↘',price:72,answer:'2 or more cuts'},{id:1,title:'Who will win the NBA championship?',sub:'Basketball · $8.2m vol',tile:'◎',price:34,answer:'Boston'},{id:2,title:'Bitcoin above $100,000 this month?',sub:'Crypto · $6.8m vol',tile:'₿',price:64,answer:'Yes'},{id:3,title:'Highest temperature in New York today?',sub:'Weather · $984k vol',tile:'☀',price:58,answer:'70° to 74°'},{id:4,title:'Who will win the presidential election?',sub:'Politics · $24.1m vol',tile:'⚑',price:51,answer:'Democratic nominee'},{id:5,title:'Next album to hit #1?',sub:'Culture · $1.2m vol',tile:'♫',price:46,answer:'Taylor Swift'}];
const chats=[{id:'c1',name:'The macro room',text:'Alex: CPI is the number to watch tomorrow',time:'2m',initial:'M',count:2,color:'#e2eadb'},{id:'c2',name:'Basketball talk',text:'Sam: Anyone taking Boston tonight?',time:'8m',initial:'B',count:1,color:'#ebe7de'},{id:'c3',name:'Sarah Chen',text:'Just sent you a market',time:'24m',initial:'SC',count:1,color:'#e3e8f0'},{id:'c4',name:'Election watch',text:'New polling is out. Thoughts?',time:'1h',initial:'E',count:0,color:'#eee5df'},{id:'c5',name:'Alex Morgan',text:'You: That makes sense, thanks!',time:'3h',initial:'AM',count:0,color:'#e0e9e4'}];
const notifications=[{id:'n1',title:'Your position is up 12%',text:'Bitcoin above $100,000 · Yes',time:'5m',initial:'↗',count:1},{id:'n2',title:'Sarah Chen followed you',text:'See what Sarah is trading',time:'18m',initial:'SC',count:1},{id:'n3',title:'Alex replied to your post',text:'“Watching the next CPI print too.”',time:'1h',initial:'AM',count:1}];
const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const unread=(list)=>list.reduce((n,x)=>n+(state.read.has(x.id)?0:x.count),0);
const avatar=(name,cls='')=>`<div class="avatar ${cls}">${name}</div>`;
const header=(title,extra='')=>`<header class="header"><h2>${title}</h2><div class="header-actions">${extra}${state.chat?'':`<button class="profile-shortcut" aria-label="Open your social profile" onclick="navigate('portfolio');setPortfolio('Profile')">${avatar('CH','dark')}</button>`}</div></header>`;
const tabs=(names,current,action)=>`<div class="tabs">${names.map(n=>`<button class="${current===n?'selected':''}" onclick="${action}('${n}')">${n}${action==='setInbox'&&unread(n==='Chats'?chats:notifications)?`<span class="count">${unread(n==='Chats'?chats:notifications)}</span>`:''}</button>`).join('')}</div>`;
const marketRow=(m)=>`<button class="market" onclick="openMarket(${m.id})"><span class="tile">${m.tile}</span><span class="name">${m.title}<small>${m.sub}</small></span><span class="price">${m.price}%<small>${m.answer}</small></span></button>`;
function navigate(tab){state.tab=tab;state.chat=null;render(true)}
function setTrade(v){state.trade=v;render(true)}function setInbox(v){state.inbox=v;render(true)}function setPortfolio(v){state.portfolio=v;render(true)}function setCategory(v){state.category=v;render()}
function render(reset=false){const screen=document.getElementById('screen');screen.innerHTML=({trade:trade,inbox:inbox,portfolio:portfolio,invest:invest,search:search})[state.tab]();document.getElementById('nav').innerHTML=['trade','inbox','portfolio','invest','search'].map((n,i)=>`<button aria-label="${['Trade','Inbox','Portfolio','Invest','Search'][i]}" aria-current="${state.tab===n?'page':'false'}" class="${state.tab===n?'active':''}" onclick="navigate('${n}')">${icon(n)}${n==='inbox'&&unread([...chats,...notifications])?`<span class="badge">${unread([...chats,...notifications])}</span>`:''}<span>${['Trade','Inbox','$4.2K','Invest','Search'][i]}</span></button>`).join('');if(reset)screen.scrollTop=0;}
function trade(){return header('<span class="wordmark">Kalshi</span>',`<button class="earn-upsell" onclick="referral()">${icon('gift')}Earn $25</button>`)+tabs(['Trade','Talk'],state.trade,'setTrade')+(state.trade==='Talk'?feed():forYou())}
function forYou(){let visible=state.category==='All'?markets:markets.filter(m=>m.sub.includes(state.category));return `<div class="chips">${['All','Live','Sports','Politics','Economics','Crypto','Culture'].map(c=>`<button class="chip ${state.category===c?'active':''}" onclick="setCategory('${c}')">${c}</button>`).join('')}</div>`+(state.category==='Live'?live():forYouMarkets(visible))}
function forYouMarkets(visible){return (state.category==='All'?`<button class="hero" onclick="openMarket(0)"><div class="row"><span class="eyebrow">In focus</span><span class="tile" style="width:34px;height:34px;background:#e3ebdc">↘</span></div><h3>Where are interest<br>rates headed?</h3><div class="row"><div><span class="odds">72<span style="font-size:21px">%</span></span><div class="muted" style="margin-top:4px">2 or more cuts this year</div></div><span class="yes">↑ 8 today</span></div><div class="row" style="border-top:1px solid #e0e7dc;margin-top:18px;padding-top:13px"><div class="stack">${avatar('SC')}${avatar('AM')}${avatar('JL')}<span style="font-size:10px;color:#7f897b;margin-left:14px">People you follow are trading</span></div>${icon('arrow')}</div></button>`:'')+`<div class="section"><h3 class="section-title">${state.category==='All'?'Popular right now':state.category}</h3>${(visible.length?visible:markets.filter(m=>m.sub.includes('Basketball'))).map(marketRow).join('')}</div><div class="notice">Illustrative markets and odds for this prototype.</div>`}
function feed(){return `<div class="subhead"><span class="muted">From people you follow</span><button aria-label="Write a post" onclick="composePost()">${icon('plus')}</button></div>`+[{name:'Sarah Chen',handle:'@sarahtrades · 12m',initial:'SC',text:'The market is underestimating how sticky inflation is. Added to my position ahead of the next CPI report.',m:0},{name:'Alex Morgan',handle:'@alexm · 34m',initial:'AM',text:'A strong bench and a favorable bracket. I like Boston at this price.',m:1},{name:'Jamie Lee',handle:'@jamie · 1h',initial:'JL',text:'Watching this one into the weekend.',m:2}].map((p,i)=>`<article class="feed-post"><div class="post-head"><button onclick="showPerson('${p.name}')">${avatar(p.initial)}</button><div><strong>${p.name}</strong><small>${p.handle}</small></div><button class="follow" style="margin-left:auto" onclick="toggleFollow('${p.name}')">${state.follow.has(p.name)?'Following':'Follow'}</button></div><p class="post-body">${p.text}</p><button class="mini-market" onclick="openMarket(${p.m})">${markets[p.m].title}<div class="row"><span class="muted">${markets[p.m].answer}</span><span class="yes">Yes ${markets[p.m].price}¢ →</span></div></button><div class="post-actions"><button aria-label="Like post ${i+1}" onclick="toggleLike(${i})" style="${state.likes.has(i)?'color:#138347':''}">${icon('heart')}${24+i*13+(state.likes.has(i)?1:0)}</button><button onclick="postReplies('${p.name}')">${icon('comment')}${6+i*3}</button><button aria-label="Share post" onclick="toast('Demo link copied to your prototype clipboard')">${icon('share')}</button></div></article>`).join('')}
function live(){return `<div class="section" style="padding-top:22px"><div class="row" style="margin-bottom:17px"><h3 class="section-title" style="margin:0">Happening now</h3><span class="live-label">● LIVE</span></div>${[{a:'Boston',b:'New York',score:'87 — 82',time:'Q4 · 8:42',n:1},{a:'Los Angeles',b:'Denver',score:'54 — 61',time:'Halftime',n:1}].map(g=>`<div class="match"><div class="row"><span class="muted">Basketball</span><span class="live-label">${g.time}</span></div><div class="teams"><span>${g.a}</span><span style="font-size:15px">${g.score}</span><span>${g.b}</span></div><div class="bet-row"><button onclick="openMarket(${g.n})">${g.a} 64¢</button><button onclick="openMarket(${g.n})">${g.b} 36¢</button></div><button style="font-size:11px;color:#81897c;margin-top:16px;display:flex;align-items:center;gap:7px" onclick="openChat('c2')">${icon('comment')} Join the conversation · 248</button></div>`).join('')}<h3 class="section-title" style="margin-top:24px">Moving now</h3>${marketRow(markets[2])}${marketRow(markets[3])}</div>`}
function inbox(){if(state.chat)return chatView();let list=state.inbox==='Chats'?chats:notifications;return header('Inbox',`<button aria-label="Mark all read" onclick="markAllRead()">${icon('check')}</button>`)+tabs(['Chats','Notifications'],state.inbox,'setInbox')+`<button class="chat-upsell" aria-label="Start a chat" onclick="newChat()"><span class="upsell-icon">${icon('comment')}</span><span><strong>Start a chat</strong><small>Share markets and trade ideas<br>with friends.</small></span>${icon('arrow')}</button><div class="subhead"><span class="eyebrow">${state.inbox==='Chats'?'Your conversations':'Recent activity'}</span>${state.inbox==='Chats'?`<button aria-label="New chat" onclick="newChat()">${icon('plus')}</button>`:''}</div>`+list.map(x=>`<button class="inbox-row ${x.count&&!state.read.has(x.id)?'unread':''}" onclick="${state.inbox==='Chats'?`openChat('${x.id}')`:`openNotification('${x.id}')`}"><span class="avatar" style="background:${x.color||'#e7eddf'}">${x.initial}</span><span class="info"><strong>${x.name||x.title}</strong><p>${x.text}</p></span><span class="time">${x.time}<br>${x.count&&!state.read.has(x.id)?`<span class="dot"></span>`:''}</span></button>`).join('')}
function openChat(id){state.read.add(id);state.chat=id;state.tab='inbox';render(true)}
function chatView(){let c=chats.find(x=>x.id===state.chat);return header(`<button class="back" onclick="state.chat=null;render(true)">${icon('back')}${c.name}</button>`)+`<div class="conversation"><div class="eyebrow" style="text-align:center">Today</div><div class="bubble">${c.text.replace(/^(Alex: |Sam: |You: )/,'')}</div><div class="bubble">What do you think about this market?</div><button class="mini-market" onclick="openMarket(${c.id==='c2'?1:0})">${markets[c.id==='c2'?1:0].title}<div class="row"><span class="muted">Shared market</span><span class="yes">View market →</span></div></button>${(state.messages[c.id]||[]).map(x=>`<div class="bubble me">${esc(x)}</div>`).join('')}</div><form class="chat-compose" onsubmit="sendMessage(event)"><input id="message" aria-label="Message" placeholder="Message ${c.name}…" autocomplete="off"><button aria-label="Send message">↑</button></form><div class="notice">Messages stay in this prototype.</div>`}
function sendMessage(e){e.preventDefault();const input=document.getElementById('message');if(!input.value.trim())return;(state.messages[state.chat]??=[]).push(input.value.trim());render();document.getElementById('screen').scrollTop=99999}
function openNotification(id){state.read.add(id);render();if(id==='n1')openMarket(2);else showPerson(id==='n2'?'Sarah Chen':'Alex Morgan')}
function markAllRead(){[...chats,...notifications].forEach(x=>state.read.add(x.id));render();toast('All caught up')}
function portfolio(){return header('Your account').replace('class="header"','class="header account-header"')+tabs(['Portfolio','Profile'],state.portfolio,'setPortfolio').replace('class="tabs"','class="tabs account-tabs"')+(state.portfolio==='Profile'?profile():`<div class="balance"><span class="muted">Portfolio value</span><h1>$4,286.50</h1><span class="green" style="font-size:12px">↗ $186.50 (4.55%) today</span><svg class="chart" viewBox="0 0 340 100" preserveAspectRatio="none" role="img" aria-label="Illustrative portfolio value over the selected period"><path d="${state.period==='1D'?'M0 85 12 83 22 87 36 77 48 80 61 65 73 70 87 57 99 62 112 50 124 54 137 38 148 45 160 44 172 56 184 45 196 47 208 32 220 35 232 18 244 28 256 20 268 24 280 10 292 17 304 8 316 14 329 4 340 8':'M0 91 20 88 40 93 60 76 80 82 100 60 120 68 140 52 160 59 180 37 200 49 220 29 240 35 260 17 280 25 300 9 320 14 340 2'}"/></svg><div class="periods">${['1D','1W','1M','3M','ALL'].map(p=>`<button class="${state.period===p?'selected':''}" onclick="state.period='${p}';render()">${p}</button>`).join('')}</div><div class="stats"><div><span class="muted">Available cash</span><strong>$1,250.00</strong></div><div><span class="muted">Positions</span><strong>$3,036.50</strong></div></div><button class="primary" onclick="deposit()">Add money</button></div><div class="section"><div class="row"><h3 class="section-title">Your positions</h3><span class="muted">3 open</span></div>${[markets[0],markets[2],markets[1]].map(marketRow).join('')}</div><div class="notice">Sample balance and chart. No account is connected.</div>`)}
function setProfileTab(v){state.profileTab=v;render()}
function profile(){return `<div class="profile-head" style="padding:16px 21px 12px">${avatar('CH','dark')}<h3>Claudia Haddad</h3><p>@claudia</p><p style="color:#333;margin:12px 0"><strong>248</strong> followers &nbsp; · &nbsp; <strong>86</strong> following</p><button class="outline" style="padding:8px 18px;font-size:12px" onclick="editProfile()">Edit profile</button></div>`+tabs(['Posts','Stats','Positions'],state.profileTab,'setProfileTab')+profileContent()}
function profileContent(){if(state.profileTab==='Positions')return `<div class="section" style="padding-top:16px"><div class="row"><h3 class="section-title">Open positions</h3><span class="muted">3 positions</span></div>${[markets[0],markets[2],markets[1]].map(marketRow).join('')}</div>`;if(state.profileTab==='Stats')return `<div class="section" style="padding-top:18px"><span class="eyebrow">Trading stats · All time</span><div class="stats"><div><span class="muted">Total profit</span><strong class="green">+$786.50</strong></div><div><span class="muted">Return</span><strong class="green">+22.5%</strong></div></div><div class="stats"><div><span class="muted">Markets traded</span><strong>42</strong></div><div><span class="muted">Win rate</span><strong>64%</strong></div></div><p class="notice" style="padding:8px 0">Illustrative profile stats for this prototype.</p></div>`;return `<article class="feed-post"><div class="post-head">${avatar('CH','dark')}<div><strong>Claudia Haddad</strong><small>@claudia · 2h</small></div></div><p class="post-body">Watching the next CPI print closely.</p><button class="mini-market" onclick="openMarket(0)">${markets[0].title}<div class="row"><span class="muted">2 or more cuts</span><span class="yes">Yes 72¢ →</span></div></button><div class="post-actions"><button aria-label="Like your post" onclick="toggleLike(3)">${icon('heart')}${state.likes.has(3)?13:12}</button><button onclick="postReplies('Claudia Haddad')">${icon('comment')} 3</button><button aria-label="Share your post" onclick="toast('Demo post link ready to share')">${icon('share')}</button></div></article>`}

function invest(){return header('Invest')+`<div class="section" style="padding-top:9px"><span class="muted">Longer-term positions</span></div><div class="invest-card"><span class="eyebrow">Your outlook, over time</span><h3>Take the long view.</h3><p>Explore markets on the economy, technology, and what comes next.</p><button class="primary" onclick="document.getElementById('themes').scrollIntoView({behavior:'smooth'})">Explore themes</button></div><div class="section" id="themes"><h3 class="section-title">Explore by theme</h3>${[{name:'The economy',desc:'Rates, inflation, and growth',symbol:'↗',m:0},{name:'The future of crypto',desc:'Bitcoin milestones and beyond',symbol:'₿',m:2},{name:'Politics & policy',desc:'Elections and the decisions ahead',symbol:'⚑',m:4}].map(t=>`<button class="market" onclick="theme('${t.name}',${t.m})"><span class="tile">${t.symbol}</span><span class="name">${t.name}<small>${t.desc}</small></span>${icon('arrow')}</button>`).join('')}<h3 class="section-title" style="margin-top:25px">On your horizon</h3>${marketRow(markets[0])}</div><div class="notice">Illustrative discovery concept for Invest. All content is sample data.</div>`}
function search(){return header('Search')+`<form class="searchbox" onsubmit="doSearch(event)">${icon('search')}<input id="query" aria-label="Search markets or ask AI" placeholder="Search markets or ask a question" value="${esc(state.query)}"><button aria-label="Submit search">${icon('arrow')}</button></form>`+(state.query?searchResults():`<div class="ai"><div class="row"><strong style="display:flex;align-items:center;gap:7px">${icon('spark')} Ask Kalshi</strong><span class="eyebrow" style="font-size:8px">AI search</span></div><p>Start with a question. Find the markets behind it.</p>${['What is the outlook for interest rates?','What are people trading in crypto?'].map(q=>`<button class="suggestion" onclick="ask('${q}')">${q} ↗</button>`).join('')}</div><div class="section"><div class="row"><h3 class="section-title">Leaderboard</h3><button class="muted" onclick="leaderboard()">View all →</button></div><span class="muted">Top traders this month</span>${leaders()}<h3 class="section-title" style="margin-top:25px">Trending searches</h3>${['Bitcoin','Fed rates','NBA championship'].map(q=>`<button class="market" onclick="ask('${q}',false)">${icon('search')}<span class="name">${q}</span>${icon('arrow')}</button>`).join('')}</div>`)}
const people=['Sarah Chen','Alex Morgan','Jamie Lee','Jordan Davis','Taylor Park'];
function leaders(all=false){return people.slice(0,all?5:3).map((n,i)=>`<div class="leader"><span class="rank">${i+1}</span><button style="padding:0" aria-label="View ${n}" onclick="showPerson('${n}')">${avatar(n.split(' ').map(x=>x[0]).join(''))}</button><button class="name" style="text-align:left;padding:0" onclick="showPerson('${n}')"><strong style="font-size:12px">${n}</strong><div class="green" style="font-size:11px;margin-top:4px">+$${['12,480','9,320','7,845','6,120','5,480'][i]}</div></button><button class="follow" onclick="toggleFollow('${n}')">${state.follow.has(n)?'Following':'Follow'}</button></div>`).join('')}
function doSearch(e){e.preventDefault();state.query=document.getElementById('query').value.trim();state.ai=state.query.includes('?');render(true)}function ask(q,ai=true){state.query=q;state.ai=ai;render(true)}
function searchResults(){const q=state.query.toLowerCase();let matches=markets.filter(m=>(m.title+' '+m.sub).toLowerCase().includes(q));if(state.ai){matches=/crypto|bitcoin/.test(q)?[markets[2]]:/rate|inflation|econom/.test(q)?[markets[0]]:[markets[0],markets[2]]}return `<div class="section"><div class="row"><h3 class="section-title">${state.ai?'Markets for your question':'Search results'}</h3><button class="muted" onclick="state.query='';state.ai=false;render()">Clear</button></div></div>${state.ai?`<div class="ai"><strong style="display:flex;gap:8px;align-items:center">${icon('spark')} ${/crypto|bitcoin/.test(q)?'Crypto outlook':'The economic outlook'}</strong><p>${/crypto|bitcoin/.test(q)?'Explore how traders are pricing Bitcoin milestones.':'Explore markets on rate decisions and economic outcomes to see how traders are pricing the outlook.'}</p><span class="eyebrow" style="font-size:8px">Sample AI response · not a live model</span></div>`:''}<div class="section">${matches.length?matches.map(marketRow).join(''):`<p class="muted" style="line-height:1.6">No sample markets match “${esc(state.query)}”. Try Bitcoin, Fed, or NBA.</p>`}</div>`}
function toggleFollow(n){state.follow.has(n)?state.follow.delete(n):state.follow.add(n);render();if(document.getElementById('person-follow'))document.getElementById('person-follow').textContent=state.follow.has(n)?'Following':'Follow';toast(state.follow.has(n)?`Following ${n}`:`Unfollowed ${n}`)}function toggleLike(i){state.likes.has(i)?state.likes.delete(i):state.likes.add(i);render()}
function sheet(html){document.getElementById('overlay').innerHTML=`<div class="sheet-shade" onclick="if(event.target===this)closeSheet()"><section class="sheet" role="dialog" aria-modal="true" aria-label="Prototype detail"><div class="handle"></div><button class="close" aria-label="Close" onclick="closeSheet()">×</button>${html}</section></div>`;document.querySelector('.sheet .close').focus()}
function referral(){sheet(`<span class="eyebrow">Invite friends</span><h3>Earn $25</h3><p style="font-size:14px;line-height:1.6;color:#75816e">Share Kalshi with friends.</p><button class="primary" onclick="copyInvite()">Copy demo invite link</button><p class="muted" style="font-size:10px;line-height:1.5;margin-top:14px">Prototype referral preview. No rewards are issued in this demo.</p>`)}
async function copyInvite(){try{await navigator.clipboard.writeText(location.origin+location.pathname+'#invite-demo');toast('Demo invite link copied')}catch{toast('Demo invite link: '+location.origin+'/#invite-demo')}}
function closeSheet(){document.getElementById('overlay').innerHTML=''}
function openMarket(id){state.market=id;state.side='Yes';marketSheet()}
function marketSheet(){const m=markets[state.market];sheet(`<span class="eyebrow">${m.sub}</span><h3>${m.title}</h3><div class="row"><span class="muted">${m.answer}</span><strong style="font-size:30px">${m.price}%</strong></div><div class="sides">${['Yes','No'].map(s=>`<button class="${state.side===s?'selected':''}" onclick="state.side='${s}';marketSheet()">${s} · ${s==='Yes'?m.price:100-m.price}¢</button>`).join('')}</div><label class="amount">Amount <span>$ <input type="number" id="amount" aria-label="Trade amount" min="1" value="10"></span></label><button class="primary" onclick="reviewTrade()">Review trade</button><p class="muted" style="text-align:center;margin-bottom:0">Simulated trade · no real money</p>`)}
function reviewTrade(){let amount=Number(document.getElementById('amount').value);if(!Number.isFinite(amount)||amount<1){toast('Enter an amount of at least $1');return}let m=markets[state.market];let contracts=Math.floor(amount/(state.side==='Yes'?m.price/100:(100-m.price)/100));sheet(`<span class="eyebrow">Review simulated trade</span><h3>${m.title}</h3><p class="row"><span class="muted">Side</span><strong>${state.side}</strong></p><p class="row"><span class="muted">Amount</span><strong>$${amount.toFixed(2)}</strong></p><p class="row"><span class="muted">Approximate contracts</span><strong>${contracts}</strong></p><button class="primary" style="margin-top:20px" onclick="closeSheet();toast('Demo trade complete. No real order was placed.')">Confirm demo trade</button><p class="muted" style="font-size:10px;text-align:center">Sample prices. Fees are excluded.</p>`)}
function showPerson(n){sheet(`<div class="profile-head">${avatar(n.split(' ').map(x=>x[0]).join(''))}<h3>${n}</h3><p>@${n.toLowerCase().replace(' ','')}</p><p>Trading economics, sports, and the big picture.</p></div><button id="person-follow" class="primary" onclick="toggleFollow('${n}')">${state.follow.has(n)?'Following':'Follow'}</button><h3 style="font-size:17px;margin-top:24px">Recent trade</h3>${marketRow(markets[0])}`)}
function leaderboard(){sheet(`<span class="eyebrow">This month · sample rankings</span><h3>Leaderboard</h3>${leaders(true)}`)}
function theme(n,id){sheet(`<span class="eyebrow">Invest · Theme</span><h3>${n}</h3><p class="muted">Explore markets for your longer-term outlook.</p>${marketRow(markets[id])}`)}
function deposit(){sheet(`<h3>Add money</h3><label class="amount">Amount<span>$ <input id="deposit" aria-label="Deposit amount" type="number" min="1" value="100"></span></label><button class="primary" onclick="demoDeposit()">Preview deposit</button><p class="muted">Prototype only. No bank account is connected.</p>`)}
function demoDeposit(){const v=Number(document.getElementById('deposit').value);if(!Number.isFinite(v)||v<1)return toast('Enter an amount of at least $1');closeSheet();toast(`Demo deposit of $${v.toFixed(2)} previewed. No money moved.`)}
function composePost(){sheet(`<h3>Share a thought</h3><form onsubmit="event.preventDefault();closeSheet();toast('Demo post shared')"><textarea required aria-label="Post text" placeholder="What are you trading?" style="width:100%;height:130px;border:1px solid #dfe5da;border-radius:10px;padding:14px;font:inherit;font-size:14px;resize:none"></textarea><button class="primary" style="margin-top:14px">Post in prototype</button></form>`)}
function postReplies(n){sheet(`<h3>Conversation</h3><div class="bubble">${n}: I’m watching how this moves over the next few days.</div><div class="bubble" style="margin-top:15px">Alex: Same here. The next data release will be interesting.</div><form style="margin-top:20px" onsubmit="event.preventDefault();closeSheet();toast('Demo reply added')"><input required aria-label="Reply" placeholder="Add a reply…" style="width:100%;padding:13px;border:1px solid #ddd;border-radius:10px"><button class="primary" style="margin-top:10px">Reply in prototype</button></form>`)}
function newChat(){sheet(`<h3>New conversation</h3>${chats.slice(2).map(c=>`<button class="market" onclick="closeSheet();openChat('${c.id}')">${avatar(c.initial)}<span class="name">${c.name}</span>${icon('arrow')}</button>`).join('')}`)}
function editProfile(){sheet(`<h3>Edit profile</h3><p class="muted">This prototype uses a sample profile.</p><label style="font-size:12px">Display name<input value="Claudia Haddad" aria-label="Display name" style="display:block;padding:13px;border:1px solid #ddd;border-radius:9px;width:100%;margin:10px 0 20px"></label><button class="primary" onclick="closeSheet();toast('Profile preview saved for this demo')">Save preview</button>`)}
let toastTimer;function toast(message){clearTimeout(toastTimer);document.getElementById('toast').innerHTML=`<div class="toast">${esc(message)}</div>`;toastTimer=setTimeout(()=>document.getElementById('toast').innerHTML='',3200)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});render();
</script></body></html>
